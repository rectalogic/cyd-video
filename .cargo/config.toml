[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32"
rustflags = ["--cfg", "esp32"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"
rustflags = ["--cfg", "esp32s3"]

[env]
ESP_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

[unstable]
build-std = ["alloc", "core"]

[alias]
run-esp32 = "run --target=xtensa-esp32-none-elf"
run-esp32s3 = "run --target=xtensa-esp32s3-none-elf"
build-esp32 = "build --target=xtensa-esp32-none-elf"
build-esp32s3 = "build --target=xtensa-esp32s3-none-elf"
