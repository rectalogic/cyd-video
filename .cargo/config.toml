[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor--chip esp32s3"

[env]
ESP_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

[unstable]
build-std = ["alloc", "core"]

[alias]
run-esp32 = "run --release --config=./.cargo/config.esp32.toml --features=esp32"
run-esp32s3 = "run --release --config=./.cargo/config.esp32s3.toml --features=esp32s3"
build-esp32 = "build --config=./.cargo/config.esp32.toml --features=esp32"
build-esp32s3 = "build --config=./.cargo/config.esp32s3.toml --features=esp32s3"
